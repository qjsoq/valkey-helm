name: Release Charts

# Manual only. This is a fork of valkey-io/valkey-helm and it exists to maintain
# the valkey-cluster chart; the valkey, valkey-operator and valkey-resources
# charts belong to upstream and must never be republished from here.
on:
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Package valkey-cluster only
        run: |
          mkdir -p .cr-release-packages
          helm package valkey-cluster --destination .cr-release-packages
          ls -l .cr-release-packages

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: .
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io/${repo} --username ${GITHUB_ACTOR} --password-stdin
          for pkg in .cr-release-packages/*; do
            if [ -z "${pkg:-}" ]; then
              break
            fi
            chart_name=$(helm show chart "${pkg}" | grep '^name:' | awk '{print $2}')
            chart_version=$(helm show chart "${pkg}" | grep '^version:' | awk '{print $2}')
            if helm show chart "oci://ghcr.io/${repo}/${chart_name}" --version "${chart_version}" &>/dev/null; then
              echo "Skipping ${chart_name}:${chart_version} — already exists in GHCR"
              continue
            fi
            echo "Pushing ${chart_name}:${chart_version} to ghcr.io/${repo}"
            helm push "${pkg}" "oci://ghcr.io/${repo}"
          done
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
